services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logtrack
      POSTGRES_PASSWORD: logtrack
      POSTGRES_DB: logtrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logtrack -d logtrack"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    environment:
      DATABASE_URL: postgres://logtrack:logtrack@db:5432/logtrack
      PORT: 3000
      AUTO_MIGRATE: "true"
      # API_TOKEN: change-me
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
